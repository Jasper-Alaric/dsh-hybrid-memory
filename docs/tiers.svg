<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="dsh-hybrid-memory tiers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f1d"/>
      <stop offset="1" stop-color="#0d2c28"/>
    </linearGradient>
    <style>
      .title { fill: #f0fdfa; font-family: Inter, Segoe UI, sans-serif; font-size: 28px; font-weight: 800; }
      .sub { fill: #8fb8b2; font-family: Inter, Segoe UI, sans-serif; font-size: 14px; }
      .tier { fill: #f0fdfa; font-family: Inter, Segoe UI, sans-serif; font-size: 19px; font-weight: 800; }
      .body { fill: #d1fae5; font-family: Inter, Segoe UI, sans-serif; font-size: 13px; }
      .muted { fill: #8fb8b2; font-family: Inter, Segoe UI, sans-serif; font-size: 12px; }
      .rule { fill: #d1fae5; font-family: Inter, Segoe UI, sans-serif; font-size: 13.5px; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <text class="title" x="70" y="68">Tiered memory, refined over time</text>
  <text class="sub" x="70" y="96">The top tier stays small; old entries move down, never silently out.</text>

  <g>
    <rect x="150" y="150" width="420" height="96" rx="16" fill="#134e4a" stroke="#fbbf24" stroke-opacity="0.55"/>
    <text class="tier" x="178" y="186" fill="#fef3c7">Core</text>
    <text class="body" x="178" y="210">pinned + importance ≥ 4 · default 8 entries</text>
    <text class="muted" x="178" y="232">explicit “remember this” requests live here</text>

    <rect x="110" y="264" width="500" height="96" rx="16" fill="#0f3f3a" stroke="#2dd4bf" stroke-opacity="0.4"/>
    <text class="tier" x="138" y="300">Important</text>
    <text class="body" x="138" y="324">stable preferences · decisions · key facts · default 40</text>
    <text class="muted" x="138" y="346">Core overflow is demoted to this tier</text>

    <rect x="70" y="378" width="580" height="96" rx="16" fill="#0b2f2b" stroke="#2dd4bf" stroke-opacity="0.25"/>
    <text class="tier" x="98" y="414" fill="#a7c7c2">General</text>
    <text class="body" x="98" y="438">background context · low-salience facts · default 80</text>
    <text class="muted" x="98" y="460">Important overflow is demoted to this tier</text>

    <rect x="30" y="492" width="660" height="78" rx="16" fill="#08231f" stroke="#2dd4bf" stroke-opacity="0.15"/>
    <text class="tier" x="58" y="524" fill="#7fa7a1" font-size="16">MEMORY.archive.md</text>
    <text class="body" x="58" y="546" fill="#8fb8b2">General overflow is archived here, audit only — not injected, not searched</text>
  </g>

  <g transform="translate(790 150)" font-family="Inter, Segoe UI, sans-serif">
    <rect x="0" y="0" width="360" height="420" rx="18" fill="#0b2f2b" stroke="#2dd4bf" stroke-opacity="0.18"/>
    <text x="26" y="42" fill="#5eead4" font-size="13" font-weight="700" letter-spacing="1.6">REFINEMENT RULES</text>

    <circle cx="32" cy="82" r="4" fill="#34d399"/>
    <text class="rule" x="48" y="87">Core overflow → oldest unpinned</text>
    <text class="rule" x="48" y="105" fill="#8fb8b2">entry moves to Important</text>

    <circle cx="32" cy="140" r="4" fill="#34d399"/>
    <text class="rule" x="48" y="145">Important overflow → oldest</text>
    <text class="rule" x="48" y="163" fill="#8fb8b2">unpinned entry moves to General</text>

    <circle cx="32" cy="198" r="4" fill="#34d399"/>
    <text class="rule" x="48" y="203">General overflow → oldest unpinned</text>
    <text class="rule" x="48" y="221" fill="#8fb8b2">entry is appended to the archive</text>

    <circle cx="32" cy="256" r="4" fill="#fbbf24"/>
    <text class="rule" x="48" y="261" fill="#fde68a">⭐ pinned entries never move</text>
    <text class="rule" x="48" y="279" fill="#b7a77a">automatically, in any tier</text>

    <circle cx="32" cy="314" r="4" fill="#5eead4"/>
    <text class="rule" x="48" y="319">12,000-character total cap archives</text>
    <text class="rule" x="48" y="337" fill="#8fb8b2">oldest General, then oldest Important</text>

    <circle cx="32" cy="372" r="4" fill="#5eead4"/>
    <text class="rule" x="48" y="377">Budgets editable in settings</text>
    <text x="26" y="402" fill="#6b9a94" font-size="11.5">Manual edits are re-parsed on the next read or search.</text>
  </g>

  <text x="70" y="612" fill="#6b9a94" font-family="Inter, Segoe UI, sans-serif" font-size="12">dsh-hybrid-memory · by Jasper Alaric · tiers and budgets are independent of the model and the session.</text>
</svg>
