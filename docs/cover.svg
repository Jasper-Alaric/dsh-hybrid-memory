    <text x="28" y="44" fill="#5eead4" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" letter-spacing="2">YOUR MEMORY FOLDER</text>

    <g transform="translate(28 72)" font-family="Inter, Segoe UI, sans-serif">
      <rect x="0" y="0" width="374" height="66" rx="12" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.25"/>
      <text x="18" y="27" fill="#f0fdfa" font-size="15" font-weight="700">SOUL.md</text>
      <text x="18" y="48" fill="#8fb8b2" font-size="12">identity · values · voice</text>
      <text x="340" y="38" fill="#5eead4" font-size="18" text-anchor="end">◈</text>

      <rect x="0" y="78" width="374" height="66" rx="12" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.25"/>
      <text x="18" y="105" fill="#f0fdfa" font-size="15" font-weight="700">USER.md</text>
      <text x="18" y="126" fill="#8fb8b2" font-size="12">profile · preferences</text>
      <text x="340" y="116" fill="#5eead4" font-size="18" text-anchor="end">◈</text>

      <rect x="0" y="156" width="374" height="66" rx="12" fill="url(#card)" stroke="#fbbf24" stroke-opacity="0.35"/>
      <text x="18" y="183" fill="#fef3c7" font-size="15" font-weight="700">MEMORY.md</text>
      <text x="18" y="204" fill="#b7a77a" font-size="12">Core ⭐ · Important · General</text>
      <text x="340" y="194" fill="#fbbf24" font-size="18" text-anchor="end">◈</text>

      <rect x="0" y="234" width="374" height="66" rx="12" fill="url(#card)" stroke="#2dd4bf" stroke-opacity="0.2"/>
      <text x="18" y="261" fill="#f0fdfa" font-size="15" font-weight="700">HEARTBEAT.md</text>
      <text x="18" y="282" fill="#8fb8b2" font-size="12">proactive checklist</text>
      <text x="340" y="272" fill="#5eead4" font-size="18" text-anchor="end">◈</text>

      <rect x="0" y="328" width="374" height="54" rx="12" fill="#0b2f2b" stroke="#2dd4bf" stroke-opacity="0.16"/>
      <text x="18" y="352" fill="#a7c7c2" font-size="12">BM25 index · settings.json · state.json</text>
      <text x="18" y="370" fill="#6b9a94" font-size="11">derived cache, never the source of truth</text>
    </g>
  </g>

  <g transform="translate(76 566)" font-family="Inter, Segoe UI, sans-serif">
    <text x="0" y="0" fill="#6b9a94" font-size="13">DeepSeek Harness · Host + Web bundle · npm @jasper_alaric/dsh-hybrid-memory · by Jasper Alaric</text>
    <text x="1048" y="0" fill="#5eead4" font-size="13" font-weight="700">⛄ 阿夙</text>
  </g>
